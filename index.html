<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillBridge International</title>
<meta name="description" content="SkillBridge International: courses, teachers and books.">
<link rel="icon" href="assets/favicon.png">
<link rel="preload" href="assets/fonts/plex-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/plex-arabic-700.woff2" as="font" type="font/woff2" crossorigin>
<meta name="theme-color" content="#12284a">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div id="hdr"></div>
<main>

<section class="hero"><div class="wrap">
  <div><h1 data-i18n="hero_title"></h1><p data-i18n="hero_text"></p>
  <div class="ctas"><a class="btn" href="courses.html" data-i18n="cta_courses"></a><a class="btn alt" href="books.html" data-i18n="cta_books"></a></div></div>
  <img class="hlogo" src="assets/brand/mark-reverse.webp" alt="SkillBridge International" width="480" height="266">
</div><svg class="hero-wave" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true"><path d="M0 46V20C200 -6 400 40 650 22S1050 0 1200 18V46z" fill="#f7f9fc"/></svg></section>
<div class="wrap"><ul class="quick" id="lat"></ul></div>
<section class="sec" style="padding-top:48px"><div class="wrap"><div class="sechead"><h2 data-i18n="sec_courses"></h2><a href="courses.html" data-i18n="all_courses"></a></div><div id="courses"></div></div></section>
<section class="sec alt"><div class="wrap"><h2 data-i18n="why" style="margin-bottom:24px"></h2><div class="why" id="why"></div></div></section>
<section class="sec"><div class="wrap"><h2 data-i18n="sec_how" style="margin-bottom:18px"></h2>
<ol class="steps"><li><h3 data-i18n="step1_t"></h3><p data-i18n="step1_p"></p></li><li><h3 data-i18n="step2_t"></h3><p data-i18n="step2_p"></p></li><li><h3 data-i18n="step3_t"></h3><p data-i18n="step3_p"></p></li></ol></div></section>
<section class="sec"><div class="wrap"><div class="sechead"><h2 data-i18n="sec_teachers"></h2><a href="teachers.html" data-i18n="all_teachers"></a></div><div id="teachers"></div></div></section>
<section class="sec alt"><div class="wrap"><div class="sechead"><h2 data-i18n="sec_books"></h2><a href="books.html" data-i18n="all_books"></a></div><div id="books"></div></div></section>

<section class="sec" style="padding-top:0"><div class="wrap"><div class="cta"><div><h2 data-i18n="cta_t"></h2><p data-i18n="cta_p"></p></div><a class="btn" href="courses.html" data-i18n="cta_courses"></a></div></div></section>
</main>
<div id="ftr"></div>
<script src="assets/app.js"></script>
<script src="assets/pages.js"></script>
<script>
SB.mount('');
var L=document.getElementById('lat');
[['courses.html','lat_courses','courses'],['teachers.html','lat_teachers','teachers'],['books.html','lat_books','books'],['#how','lat_how','how'],[SB.CFG.PORTAL,'lat_portal','portal'],['#contact','lat_contact','contact']].forEach(function(x){
  L.appendChild(SB.el('li',null,SB.el('a',{href:x[0]},SB.icon(x[2],26),SB.el('span',{text:SB.t(x[1])}))));});
[['teachers','v1'],['live','v2'],['lang','v3'],['pay','v4']].forEach(function(x){document.getElementById('why').appendChild(SB.el('div',null,SB.icon(x[0],28),SB.el('h3',{text:SB.t(x[1]+'_t')}),SB.el('p',{text:SB.t(x[1]+'_p')})));});
document.querySelector('.steps').parentNode.parentNode.id='how';
SBPages.loadCourses(document.getElementById('courses'),4);
SBPages.loadTeachers(document.getElementById('teachers'),4);
SBPages.loadBooks(document.getElementById('books'),4);
</script>
</body>
</html>
